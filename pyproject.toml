[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supplylens-early-warning"
version = "0.1.0"
description = "Supply chain early warning: robust baselines, change detection, a composite risk index and an onset model, scored against known disruptions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Md Abdur Rauf" }]
keywords = ["supply chain", "early warning", "anomaly detection", "change detection", "CUSUM", "EWMA", "risk"]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.4"]

[project.optional-dependencies]
app = ["streamlit>=1.50", "plotly>=5.20"]
dev = ["pytest>=7"]

[project.scripts]
early-warning = "early_warning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
